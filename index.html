<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Merlin's Revenge Remake</title>
    <style>
      html, body { margin: 0; background: #000; }
      /* margin: auto centres #game but lets it scroll instead of clipping when it is larger than the window */
      body { display: flex; min-height: 100vh; }
      #game { margin: auto; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px 0; }
      canvas { display: block; image-rendering: pixelated; }
      #controls { display: flex; gap: 16px; align-items: flex-start; font: 12px monospace; }
      #zoom, #sound { display: flex; gap: 4px; align-items: center; }
      #space-mode, #camera-mode { color: #aaa; font: 12px monospace; }
      #zoom button, #sound button {
        font: inherit; color: #aaa; background: #111; border: 1px solid #444; border-radius: 3px;
        padding: 2px 8px; cursor: pointer;
      }
      #zoom button:hover, #sound button:hover { color: #fff; border-color: #888; }
      #zoom button[aria-pressed='true'], #sound button[aria-pressed='true'] { color: #000; background: #ccc; border-color: #ccc; }
      #sound label { color: #aaa; display: flex; gap: 4px; align-items: center; }
      #sound input[type='range'] { width: 72px; margin: 0; accent-color: #ccc; }
      /* the map browser and the Favourites list beside it */
      #maps, #favourites {
        position: relative; margin: 0; padding: 0; list-style: none; overflow-y: auto;
        max-height: calc(8 * (1.25em + 2px)); /* 8 rows: button line-height + its 1px top and bottom padding */
        border: 1px solid #444; border-radius: 3px; background: #111; min-width: 16ch;
      }
      #maps li, #favourites li { display: flex; }
      #maps button, #favourites button {
        flex: 1; padding: 1px 8px; font: inherit; line-height: 1.25; text-align: left; color: #aaa;
        background: none; border: 0; white-space: nowrap; cursor: pointer;
      }
      /* star column on the left, larger glyph; line-height keeps rows the same height as the 12px text rows */
      #maps .star { flex: none; width: 22px; padding: 1px 0; font-size: 16px; line-height: 15px; text-align: center; }
      #maps button.star[aria-pressed='true'] { color: #ec4; }
      #favourites li.empty { padding: 1px 8px; line-height: 1.25; color: #666; white-space: nowrap; }
      #maps button:hover, #maps button:focus-visible, #favourites button:hover, #favourites button:focus-visible { color: #fff; background: #222; }
      #maps button:focus-visible, #favourites button:focus-visible { outline: 1px solid #888; outline-offset: -1px; }
      #maps button[aria-current='page'], #favourites button[aria-current='page'],
      #maps li:has(> [aria-current='page']) > button.star { color: #000; background: #ccc; }
      body > #maps, body > #favourites { align-self: flex-start; margin: 16px 16px 16px 0; max-height: 50vh; font: 12px monospace; }
      body > #maps { margin-left: 16px; }
    </style>
  </head>
  <body>
    <div id="game">
      <div id="controls">
        <div id="zoom" role="group" aria-label="Pixel size"></div>
        <div id="sound" role="group" aria-label="Sound"></div>
        <div id="space-mode" aria-live="polite"></div>
        <div id="camera-mode" aria-live="polite"></div>
        <ul id="maps" aria-label="Maps"></ul>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
